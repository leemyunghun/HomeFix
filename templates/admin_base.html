<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈픽스 - 관리자 센터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex h-screen overflow-hidden relative">

    <div id="mobile-overlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

    <aside id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-slate-900 text-slate-300 flex flex-col transition-transform duration-300 transform -translate-x-full md:relative md:translate-x-0 z-50 h-full">
        <div class="h-16 flex items-center justify-between px-6 border-b border-slate-800 shrink-0">
            <a href="/" class="text-xl font-black text-white tracking-tighter hover:text-blue-400 transition">
                HomeFix <span class="text-xs text-blue-500 ml-1">ADMIN</span>
            </a>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto text-sm font-medium">
            <a href="/admin_dashboard" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                <i class="fas fa-chart-pie w-5 text-center"></i> 대시보드
            </a>
            <a href="/admin/users" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                <i class="fas fa-users w-5 text-center"></i> 회원 관리
            </a>
            <a href="/admin/history" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                <i class="fas fa-clipboard-list w-5 text-center"></i> 진단 내역
            </a>
            <a href="/admin/reservations" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-800 hover:text-white transition">
                <i class="fas fa-calendar-check w-5 text-center"></i> 수리 예약 관리
            </a>
        </nav>

        <div class="p-4 border-t border-slate-800 shrink-0">
            <a href="/" class="flex items-center gap-2 px-4 py-2 text-xs text-slate-400 hover:text-white transition">
                <i class="fas fa-arrow-left"></i> 메인 서비스로 돌아가기
            </a>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-8 z-10 shrink-0">
            <div class="flex items-center gap-3 md:gap-0">
                <button onclick="toggleSidebar()" class="md:hidden text-slate-500 hover:text-blue-600 focus:outline-none p-2">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                <h1 class="font-bold text-slate-700 hidden sm:block">관리자 제어판</h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs sm:text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">
                    👑 <span class="hidden sm:inline">최고 관리자 계정</span><span class="sm:hidden">최고 관리자</span>
                </span>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-6 md:p-8 bg-slate-50">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            // 사이드바 위치 토글 (-translate-x-full 클래스 뗐다 붙였다 하기)
            sidebar.classList.toggle('-translate-x-full');
            // 배경 오버레이 숨김/표시 토글
            overlay.classList.toggle('hidden');
        }
    </script>
</body>
</html>
