{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-20 px-4">
    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-100/50">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">🔍 아이디 찾기</h2>
        <p class="text-slate-400 text-sm mb-8">가입 시 입력한 이름과 이메일을 입력해주세요.</p>

        <form method="POST" class="space-y-4">
            <input type="text" name="name" placeholder="이름" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            <input type="email" name="email" placeholder="이메일" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-blue-600 transition mt-4">
                아이디 찾기
            </button>
        </form>
    </div>
</div>
{% endblock %}
