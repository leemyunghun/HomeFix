{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 fade-in">
    <div class="flex justify-between items-center mb-2">
        <h2 class="text-2xl font-bold text-slate-800">🎧 고객지원 센터</h2>
        <a href="/support/my" class="text-sm font-bold text-blue-600 hover:text-blue-700 transition flex items-center gap-1">
            내 문의 내역 <span class="text-xs">▶</span>
        </a>
    </div>
    <p class="text-slate-500 mb-8">서비스 이용 중 불편한 점이나 궁금한 점을 남겨주세요.</p>

    <div class="bg-white p-8 rounded-3xl border shadow-sm shadow-slate-100">
        <form action="/support" method="POST">
            <div class="mb-5">
                <label class="block text-sm font-bold text-slate-700 mb-2">문의 제목</label>
                <input type="text" name="title" placeholder="제목을 입력하세요" required
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">문의 내용</label>
                <textarea name="content" rows="6" placeholder="자세한 내용을 입력해주세요" required
                    class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition resize-none"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-100 flex justify-center items-center gap-2">
                <span>문의 접수하기</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </form>
    </div>

    <div class="mt-10 grid grid-cols-2 gap-4">
        <div class="p-5 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-center">
            <p class="text-xs text-slate-400 mb-1">이메일 문의</p>
            <p class="font-bold text-slate-700">support@homefix.com</p>
        </div>
        <div class="p-5 bg-slate-50 rounded-2xl border border-dashed border-slate-200 text-center">
            <p class="text-xs text-slate-400 mb-1">운영 시간</p>
            <p class="font-bold text-slate-700">평일 09:00 ~ 18:00</p>
        </div>
    </div>
</div>
{% endblock %}
