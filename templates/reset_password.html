{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-20 px-4">
    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl shadow-slate-100/50">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">🔒 비밀번호 재설정</h2>
        <p class="text-slate-400 text-sm mb-8">본인 확인 후 새 비밀번호를 설정합니다.</p>

        <form method="POST" class="space-y-4">
            <input type="text" name="userid" placeholder="아이디" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            <input type="text" name="name" placeholder="이름" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            <input type="email" name="email" placeholder="이메일" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            <div class="pt-4 border-t border-slate-50">
                <input type="password" name="new_password" placeholder="새로운 비밀번호" required class="w-full px-5 py-4 rounded-2xl bg-blue-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 transition mt-4">
                비밀번호 변경
            </button>
        </form>
    </div>
</div>
{% endblock %}
