{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-20 px-4">
    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-xl">
        <div class="text-center mb-8">
            <span class="text-4xl">🔐</span>
            <h2 class="text-2xl font-bold text-slate-800 mt-4 mb-2">비밀번호 변경 인증</h2>
            <p class="text-slate-400 text-sm">정보 보호를 위해 기존 계정 정보와<br>가입 이메일로 본인 확인을 진행합니다.</p>
        </div>

        <form method="POST" class="space-y-4">
            <div class="space-y-3">
                <input type="text" name="userid" placeholder="아이디" required 
                       class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
                
                <input type="email" name="email" placeholder="가입 시 입력한 이메일" required 
                       class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">

                <input type="password" name="current_password" placeholder="기존 비밀번호" required 
                       class="w-full px-5 py-3.5 rounded-2xl bg-slate-50 border-none outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
            </div>

            <div class="py-4 border-t border-slate-50 mt-2">
                <label class="block text-xs font-bold text-blue-600 mb-2 ml-2">새로 바꿀 비밀번호</label>
                <input type="password" name="new_password" placeholder="새 비밀번호 입력" required 
                       class="w-full px-5 py-3.5 rounded-2xl bg-blue-50 text-blue-900 placeholder-blue-300 border-none outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition shadow-lg active:scale-95">
                인증 및 비밀번호 변경
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/login" class="text-slate-400 text-sm hover:text-blue-600 font-bold transition">
                ← 돌아가기
            </a>
        </div>
    </div>
</div>
{% endblock %}
