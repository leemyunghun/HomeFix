<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈픽스 - 통합 수리 솔루션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f5f7fa; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tighter hover:opacity-80 transition">
                HOME FIX
            </a>

            <div class="hidden md:flex gap-8">
                <a href="/rental" class="text-sm font-bold text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
                    <i class="fas fa-tools"></i> 공구 대여소
                </a>
                <a href="/expert" class="text-sm font-bold text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
                    <i class="fas fa-hard-hat"></i> 전문가 매칭
                </a>
                <a href="/review" class="text-sm font-bold text-slate-600 hover:text-blue-600 transition flex items-center gap-1">
                    <i class="fas fa-comment-dots"></i> 수리 후기
                </a>
            </div>

            <div class="flex gap-3 items-center">
                {% if user_info %}
                    <div class="flex items-center gap-2 mr-2">
                        <span class="bg-blue-100 text-blue-600 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold">
                            {{ user_info.name[0] }}
                        </span>
                        <span class="text-sm font-bold text-slate-700 hidden sm:inline">{{ user_info.name }}님</span>
                    </div>
                    <a href="/myinfo" class="text-xs font-bold text-slate-500 hover:text-blue-600 border border-slate-200 px-2 py-1 rounded transition">내 정보</a>
                    <a href="/logout" class="text-xs font-bold text-slate-400 hover:text-red-500 ml-1 transition">로그아웃</a>
                {% else %}
                    <a href="/login" class="text-sm font-bold text-slate-500 hover:text-blue-600 px-2 transition">로그인</a>
                    <a href="/signup" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md shadow-blue-200 hover:bg-blue-700 transition">회원가입</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
