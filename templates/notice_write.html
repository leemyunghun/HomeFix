{% extends "base.html" %} 
{% block content %}
<div class="max-w-4xl mx-auto py-12 px-4 fade-in min-h-[70vh]">
    <div class="mb-10 border-b border-slate-200 pb-6">
        <h2 class="text-3xl font-black text-slate-800 flex items-center gap-3">
            <i class="fas fa-pen text-blue-600"></i> 
            {{ '공지사항 수정' if is_edit else '공지사항 작성' }}
        </h2>
        <p class="text-slate-500 mt-2">
            {{ '기존 공지사항의 내용을 수정합니다.' if is_edit else '새로운 공지사항을 등록합니다.' }}
        </p>
    </div>

    <form action="{{ '/notice/edit/' ~ notice.id if is_edit else '/notice/write' }}" method="POST" class="bg-white rounded-[2rem] border border-slate-200 shadow-sm p-8">
        <div class="mb-6">
            <label for="title" class="block text-sm font-bold text-slate-700 mb-2">제목</label>
            <input 
                type="text" 
                id="title" 
                name="title" 
                required 
                placeholder="공지사항 제목을 입력하세요"
                value="{{ notice.title if is_edit else '' }}" 
                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            >
            </div>

        <div class="mb-8">
            <label for="content" class="block text-sm font-bold text-slate-700 mb-2">본문 내용</label>
            <textarea 
                id="content" 
                name="content" 
                required 
                rows="10"
                placeholder="공지할 내용을 자세히 적어주세요."
                class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 transition resize-none"
            >{{ notice.content if is_edit else '' }}</textarea>
        </div>

        <div class="flex justify-end gap-3">
            <a href="{{ '/notice/' ~ notice.id|string if is_edit else '/notice' }}" class="px-8 py-3.5 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition">
                취소
            </a>
            <button type="submit" class="px-8 py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                {{ '수정 완료' if is_edit else '등록하기' }}
            </button>
        </div>
    </form>
</div>
{% endblock %}
