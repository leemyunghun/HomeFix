{% extends "base.html" %}
{% block content %}
<style>
    .loading-container {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        min-height: 60vh; text-align: center;
    }
    .spinner {
        width: 50px; height: 50px; border: 5px solid #f1f5f9;
        border-top-color: var(--hf-primary, #2563eb);
        border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .loading-title { font-size: 24px; font-weight: 800; color: #1e293b; margin-bottom: 10px; }
    .loading-desc { font-size: 15px; color: #64748b; font-weight: 500; }
    .warning-text { font-size: 13px; color: #ef4444; margin-top: 15px; font-weight: 700; }
</style>

<div class="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">안전하게 결제를 승인하고 있습니다</div>
    <div class="loading-desc">거의 다 되었습니다. 창을 닫거나 새로고침하지 마세요!</div>
    <div class="warning-text">※ 이 과정은 몇 초 정도 걸릴 수 있습니다.</div>
</div>

<script>
// 페이지가 열리자마자 자동으로 파이썬 서버에 '최종 승인'을 요청합니다.
document.addEventListener('DOMContentLoaded', function() {
    // 1. URL에 숨어있는 보너스 포인트(point_amount)나 목적(purpose)을 가져옵니다.
    const urlParams = new URLSearchParams(window.location.search);
    const pointAmount = urlParams.get('point_amount') || '{{ amount }}';
    const purpose = urlParams.get('purpose') || 'point_charge';

    // 2. 파이썬(/payment/toss/confirm)으로 보낼 짐을 쌉니다.
    const payload = {
        paymentKey: '{{ payment_key }}',
        orderId: '{{ order_id }}',
        amount: parseInt('{{ amount }}'),
        point_amount: parseInt(pointAmount),
        purpose: purpose
    };

    // 3. 파이썬에게 최종 승인 요청 찌르기!
    fetch('/payment/toss/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if (data.result === 'success') {
            // 승인 성공! 영수증(성공) 페이지로 이동
            window.location.replace('/payment/success?order_id=' + data.order_id);
        } else {
            // 잔액 부족, 한도 초과 등 승인 실패 시
            alert('결제 승인 실패: ' + (data.message || '알 수 없는 오류'));
            window.location.replace('/payment/charge');
        }
    })
    .catch(error => {
        // 서버가 꺼졌거나 통신 에러 발생 시
        alert('서버와 통신 중 문제가 발생했습니다. 결제가 진행되지 않았습니다.');
        window.location.replace('/payment/charge');
    });
});
</script>
{% endblock %}
